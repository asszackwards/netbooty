[package]
name = "netbooty-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NetBooty boot server: answers NetBooty's signed requests on the LAN"

[dependencies]
netbooty-cfg.workspace = true
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
