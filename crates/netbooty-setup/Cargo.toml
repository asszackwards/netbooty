[package]
name = "netbooty-setup"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
netbooty-cfg.workspace = true
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
object = { version = "0.40", default-features = false, features = ["read_core", "pe", "std"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
